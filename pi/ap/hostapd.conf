# Template used by setup_ap.sh (values substituted into .runtime/hostapd.conf).
# Prefer configuring via configs/sensing.env rather than editing this file.
interface=wlan0
driver=nl80211
ssid=wifi-sensing
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=wifisense123
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
country_code=US
